name: Frontend release environment gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend-release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Managed release build
        run: npm run build
        env:
          VITE_POS_RELEASE_ID: ci-release-gate
          VITE_REQUIRED_BACKEND_CONTRACT: "1.0"
          VITE_BACKEND_URL: https://backend.example.invalid
          VITE_GOOGLE_MAPS_API_KEY: ci-browser-key
